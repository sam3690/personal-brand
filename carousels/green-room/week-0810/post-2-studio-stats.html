<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Post 2 — The ads never changed.</title>
<link rel="stylesheet" href="green-room.css">
<style>
  .wrap { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 88px; }
  .stats { margin: 0 0 72px; }
  .stat-val .from { color: rgba(242,246,243,0.42); }
  .arrow { color: rgba(242,246,243,0.42); padding: 0 14px; }

</style>
</head>

<div class="slide card">
  <div class="wrap">
    <div class="stats">
      <div class="stat-row">

        <span class="stat-val"><span class="from">24 HRS</span><span class="arrow">→</span><span class="green">SECONDS</span></span>
      </div>
      <div class="stat-row">
        <span class="stat-label">Consults / month</span>
        <span class="stat-val"><span class="from">7</span><span class="arrow">→</span><span class="green">27</span></span>
      </div>
    </div>
    <div class="h punch">THE ADS <span class="green">NEVER CHANGED.</span></div>
  </div>
  <div class="footer">
    <span class="counter"></span>
    <div class="badge big"><div class="av">UA</div><div class="nm">USAMA <span class="green">AYOUB</span></div></div>
  </div>
</div>
